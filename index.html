<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EH Personal Profile</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #080d2b, #164e9b, #6b21a8);
    color: white;
}

.card {
    width: 100%;
    max-width: 380px;
    padding: 30px 20px;
    text-align: center;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    animation: appear 1.2s ease;
}

.logo {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
}

h1 {
    color: #ffd700;
    margin-bottom: 8px;
}

h2 {
    margin-top: 10px;
}

p {
    line-height: 1.6;
}

.badge {
    display: inline-block;
    padding: 8px 15px;
    background: #ffd700;
    color: #111;
    border-radius: 20px;
    font-weight: bold;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }x

.clock {
    margin: 15px 0;
    font-size: 22px;
    font-weight: bold;
}

.theme-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #ffd700;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

body.light-mode {
    background: linear-gradient(135deg, #e0e7ff, #ffffff, #d8b4fe);
    color: #111;
}

body.light-mode .card {
    background: rgba(0,0,0,0.08);
    color: #111;}
</style>
</head>

<body>

<div class="card">

    <img src="eh-logo.png" class="logo" alt="EH Logo">

    <h1>👑 Welcome!</h1>

    <h2>Emon Hossain</h2>

    <span class="badge">EH PROFILE</span>

<div class="app-info">
    <h3>EH Personal App</h3>
    <p>⭐ 4.8 | 1K+ Reviews</p>
    <p>📥 Downloads: 1K+</p>
    <p>📱 Version: 1.0</p>
    <button class="theme-btn">Download</button>
</div>

    <p>Welcome to my Personal Profile.</p>

    <p>I am learning App Development.</p>

    <p><b>My Skills:</b> Python, HTML, CSS, Coding</p>

</div>

</body>
</html>
